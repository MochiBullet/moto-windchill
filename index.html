<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#302b63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Moto Wind Chill - バイク体感温度計算機</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      height: 100%;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.6s ease;
    }

    .container {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header .icon {
      font-size: 36px;
      margin-bottom: 4px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
    }

    .input-group label .unit {
      font-size: 0.75rem;
      color: #666;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(96, 165, 250, 0.4);
      transition: transform 0.15s;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .slider-row .value {
      min-width: 56px;
      text-align: right;
      font-size: 1.1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    .result-card {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: border-color 0.3s;
    }

    .result-card .label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .result-card .temp {
      font-size: 3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }

    .result-card .comment {
      font-size: 0.85rem;
      margin-top: 8px;
      color: #999;
    }

    .result-card .detail {
      font-size: 0.75rem;
      margin-top: 12px;
      color: #666;
      line-height: 1.6;
    }

    /* Temperature color classes */
    .temp-extreme-cold { color: #93c5fd; border-color: rgba(147, 197, 253, 0.3) !important; }
    .temp-very-cold    { color: #7dd3fc; border-color: rgba(125, 211, 252, 0.3) !important; }
    .temp-cold         { color: #67e8f9; border-color: rgba(103, 232, 249, 0.3) !important; }
    .temp-cool         { color: #5eead4; border-color: rgba(94, 234, 212, 0.3) !important; }
    .temp-mild         { color: #a3e635; border-color: rgba(163, 230, 53, 0.3) !important; }
    .temp-warm         { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3) !important; }
    .temp-hot          { color: #fb923c; border-color: rgba(251, 146, 60, 0.3) !important; }
    .temp-very-hot     { color: #f87171; border-color: rgba(248, 113, 113, 0.3) !important; }

    .install-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 12px;
      background: rgba(167, 139, 250, 0.1);
      color: #c4b5fd;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .install-btn:hover {
      background: rgba(167, 139, 250, 0.2);
      border-color: rgba(167, 139, 250, 0.6);
    }

    .install-btn:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 0.7rem;
      color: #555;
    }

    @media (max-height: 700px) {
      .container { padding: 20px 24px; }
      .header { margin-bottom: 12px; }
      .input-group { margin-bottom: 10px; }
      .result-card { margin-top: 14px; padding: 14px; }
      .result-card .temp { font-size: 2.4rem; }
      .footer { margin-top: 10px; }
    }

    @media (max-width: 500px) {
      .container { padding: 24px 20px; }
      .result-card .temp { font-size: 2.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🏍️</div>
      <h1>バイク体感温度計算機</h1>
      <p>Motorcycle Wind Chill Calculator</p>
    </div>

    <div class="input-group">
      <label>気温 <span class="unit">℃</span></label>
      <div class="slider-row">
        <input type="range" id="temp" min="-20" max="45" step="1" value="20">
        <span class="value" id="tempVal">20</span>
      </div>
    </div>

    <div class="input-group">
      <label>走行速度 <span class="unit">km/h</span></label>
      <div class="slider-row">
        <input type="range" id="speed" min="0" max="180" step="5" value="60">
        <span class="value" id="speedVal">60</span>
      </div>
    </div>

    <div class="input-group">
      <label>湿度 <span class="unit">%</span></label>
      <div class="slider-row">
        <input type="range" id="humidity" min="0" max="100" step="5" value="50">
        <span class="value" id="humidityVal">50</span>
      </div>
    </div>

    <div class="input-group">
      <label>風速（向かい風） <span class="unit">m/s</span></label>
      <div class="slider-row">
        <input type="range" id="wind" min="0" max="20" step="1" value="0">
        <span class="value" id="windVal">0</span>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="label">体感温度</div>
      <div class="temp" id="resultTemp">--</div>
      <div class="comment" id="resultComment"></div>
      <div class="detail" id="resultDetail"></div>
    </div>

    <button class="install-btn" id="installBtn">ホーム画面に追加</button>

    <div class="footer">
      ※ JAF / Environment Canada 風速冷却モデルに基づく近似計算です
    </div>
  </div>

  <script>
    const sliders = {
      temp:     { el: document.getElementById('temp'),     display: document.getElementById('tempVal'),     suffix: '' },
      speed:    { el: document.getElementById('speed'),    display: document.getElementById('speedVal'),    suffix: '' },
      humidity: { el: document.getElementById('humidity'), display: document.getElementById('humidityVal'), suffix: '' },
      wind:     { el: document.getElementById('wind'),     display: document.getElementById('windVal'),     suffix: '' },
    };

    const resultCard    = document.getElementById('resultCard');
    const resultTemp    = document.getElementById('resultTemp');
    const resultComment = document.getElementById('resultComment');
    const resultDetail  = document.getElementById('resultDetail');

    function calculate() {
      const T = Number(sliders.temp.el.value);           // ℃
      const S = Number(sliders.speed.el.value);           // km/h
      const H = Number(sliders.humidity.el.value);        // %
      const W = Number(sliders.wind.el.value);            // m/s

      // Update displays
      sliders.temp.display.textContent     = T;
      sliders.speed.display.textContent    = S;
      sliders.humidity.display.textContent = H;
      sliders.wind.display.textContent     = W;

      // Effective wind speed
      const effectiveWindKmh = S + W * 3.6;
      const effectiveWindMs = effectiveWindKmh / 3.6;

      let feelsLike;

      if (T <= 10 && effectiveWindKmh >= 4.8) {
        // NWS / Environment Canada Wind Chill Index (valid: T<=10℃, wind>=4.8km/h)
        feelsLike = 13.12 + 0.6215 * T
                    - 11.37 * Math.pow(effectiveWindKmh, 0.16)
                    + 0.3965 * T * Math.pow(effectiveWindKmh, 0.16);
      } else {
        // Australian Apparent Temperature (Steadman 1994)
        // Works across all temperature ranges, accounts for wind + humidity
        // e = water vapor pressure (hPa)
        const e = (H / 100) * 6.105 * Math.exp((17.27 * T) / (237.7 + T));
        // AT = T + 0.33*e - 0.7*ws - 4.0
        feelsLike = T + 0.33 * e - 0.7 * effectiveWindMs - 4.0;
      }

      const rounded = Math.round(feelsLike * 10) / 10;
      resultTemp.textContent = rounded.toFixed(1) + '℃';

      // Color and comment
      let cls, comment;
      if (rounded <= -20)     { cls = 'temp-extreme-cold'; comment = '極寒 — 走行は危険です'; }
      else if (rounded <= -10){ cls = 'temp-very-cold';    comment = '厳寒 — 完全防寒が必須'; }
      else if (rounded <= 0)  { cls = 'temp-cold';         comment = '凍える寒さ — 防寒対策を万全に'; }
      else if (rounded <= 10) { cls = 'temp-cool';         comment = '寒い — 重ね着推奨'; }
      else if (rounded <= 20) { cls = 'temp-mild';         comment = '快適 — ツーリング日和'; }
      else if (rounded <= 28) { cls = 'temp-warm';         comment = '暖かい — メッシュジャケット推奨'; }
      else if (rounded <= 35) { cls = 'temp-hot';          comment = '暑い — こまめに水分補給を'; }
      else                    { cls = 'temp-very-hot';     comment = '猛暑 — 熱中症に注意'; }

      resultCard.className = 'result-card ' + cls;
      resultComment.textContent = comment;
      resultDetail.textContent = `合成風速: ${effectiveWindKmh.toFixed(1)} km/h（走行 ${S} + 風 ${(W * 3.6).toFixed(1)}）`;

      // Background gradient based on feels-like temperature
      const bg = getBackgroundGradient(rounded);
      document.body.style.background = bg;
    }

    function getBackgroundGradient(temp) {
      // Color stops: deep blue (extreme cold) -> cyan -> teal -> green -> yellow -> orange -> red (extreme hot)
      // All kept dark enough so white text stays readable
      const stops = [
        { t: -30, c1: [10, 15, 60],  c2: [20, 30, 90]  },  // deep navy blue
        { t: -10, c1: [12, 40, 80],  c2: [20, 60, 100] },  // dark blue
        { t:   0, c1: [10, 50, 70],  c2: [15, 70, 85]  },  // dark cyan
        { t:  10, c1: [10, 55, 55],  c2: [15, 75, 70]  },  // dark teal
        { t:  20, c1: [20, 50, 35],  c2: [30, 65, 45]  },  // dark green
        { t:  28, c1: [60, 45, 10],  c2: [80, 60, 15]  },  // dark amber
        { t:  35, c1: [75, 30, 10],  c2: [95, 40, 15]  },  // dark orange
        { t:  45, c1: [80, 15, 15],  c2: [100, 25, 20] },  // dark red
      ];

      // Clamp
      const clamped = Math.max(stops[0].t, Math.min(stops[stops.length - 1].t, temp));

      // Find surrounding stops
      let lower = stops[0], upper = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) {
        if (clamped >= stops[i].t && clamped <= stops[i + 1].t) {
          lower = stops[i];
          upper = stops[i + 1];
          break;
        }
      }

      const ratio = (upper.t === lower.t) ? 0 : (clamped - lower.t) / (upper.t - lower.t);
      const lerp = (a, b) => Math.round(a + (b - a) * ratio);

      const r1 = lerp(lower.c1[0], upper.c1[0]);
      const g1 = lerp(lower.c1[1], upper.c1[1]);
      const b1 = lerp(lower.c1[2], upper.c1[2]);
      const r2 = lerp(lower.c2[0], upper.c2[0]);
      const g2 = lerp(lower.c2[1], upper.c2[1]);
      const b2 = lerp(lower.c2[2], upper.c2[2]);

      return `linear-gradient(135deg, rgb(${r1},${g1},${b1}), rgb(${r2},${g2},${b2}))`;
    }

    // Bind events
    Object.values(sliders).forEach(s => {
      s.el.addEventListener('input', calculate);
    });

    // Initial calculation
    calculate();

    // PWA install
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        // Fallback: show manual instructions for iOS / unsupported browsers
        const ua = navigator.userAgent;
        if (/iPhone|iPad/.test(ua)) {
          alert('画面下の共有ボタン（↑）から\n「ホーム画面に追加」を選んでください');
        } else {
          alert('ブラウザのメニューから\n「ホーム画面に追加」を選んでください');
        }
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });

    // Hide install button if already running as standalone app
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      installBtn.style.display = 'none';
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
